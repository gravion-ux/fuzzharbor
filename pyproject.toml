[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzharbor"
version = "0.1.0"
description = "A reproducible local fuzzing campaign manager and crash triage toolkit."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fuzzharbor = "fuzzharbor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
